<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imóvel | RE/MAX Agapê</title>
  <!--META-->
  <meta name="theme-color" content="#13284a">
  <link rel="icon" href="/img/favicon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://images.usenonstop.com.br">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container" id="conteudo">
    <nav class="migalhas" aria-label="Você está em"><a href="/">Início</a></nav>
    <div class="galeria"><div class="sk" style="grid-row:span 2"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="imovel-layout">
      <div><div class="sk" style="height:34px;width:70%;margin-bottom:12px"></div><div class="sk" style="height:18px;width:50%"></div></div>
      <div class="caixa-preco"><div class="sk" style="height:40px;width:60%"></div></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galeria de fotos">
    <div class="lb-topo">
      <span id="lb-contador"></span>
      <button class="icone-btn" type="button" id="lb-fechar" aria-label="Fechar galeria">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="lb-palco">
      <button class="icone-btn ant" type="button" id="lb-ant" aria-label="Foto anterior"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <img id="lb-img" alt="">
      <button class="icone-btn prox" type="button" id="lb-prox" aria-label="Próxima foto"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="lb-tiras" id="lb-tiras"></div>
  </div>

  <script src="/js/comum.js"></script>
  <script src="/js/imovel.js"></script>
</body>
</html>
